# -----------------------------------------------------
# tmux · Cyber theme (matches the Cyber waybar / prompt)
#
#  ▌ main ▐  1 zsh   2 nvim   [3 msf]          󰖂 10.10.14.7 │ archlinux │ 23:41
# -----------------------------------------------------

# True color, so the exact neon hex colors render (kitty supports RGB)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Palette
%hidden BG="#0b1017"
%hidden BG_ALT="#0f1620"
%hidden RAISE="#162130"
%hidden FG="#c8f7ff"
%hidden SUB="#8fb8c4"
%hidden DIM="#4a6b78"
%hidden ACCENT="#00f0ff"
%hidden ACCENT2="#ff2bd6"
%hidden OK="#39ff14"
%hidden WARN="#ffb000"

# -----------------------------------------------------
# Status bar
# -----------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=$BG_ALT,fg=$SUB"

# Left: session name (magenta while the prefix key is pressed)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=$ACCENT2],#[bg=$ACCENT]}#[fg=$BG,bold] #S #[bg=$BG_ALT,fg=$DIM,nobold] "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=$DIM] #I #[fg=$SUB]#W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[bg=$RAISE,fg=$ACCENT,bold]▎#I #[fg=$FG]#W#{?window_zoomed_flag,#[fg=$WARN] 󰊓,} #[bg=$BG_ALT,nobold]"
set -g window-status-activity-style "fg=$WARN"
set -g window-status-bell-style "fg=$ACCENT2,bold"

# Right: VPN IP (if up) │ host │ time
set -g status-right-length 80
set -g status-right "#[fg=$OK]#(ip -o -4 addr show 2>/dev/null | awk '$2 ~ /^(tun|wg|tap)/ {split($4,a,\"/\"); printf \"󰖂 %%s \", a[1]; exit}')#[fg=$DIM]│ #[fg=$SUB]#H #[fg=$DIM]│ #[fg=$ACCENT]%H:%M "

# -----------------------------------------------------
# Panes, messages, copy mode
# -----------------------------------------------------
set -g pane-border-style "fg=$RAISE"
set -g pane-active-border-style "fg=$ACCENT"
set -g pane-border-lines heavy
set -g display-panes-colour "$DIM"
set -g display-panes-active-colour "$ACCENT"

set -g message-style "bg=$BG_ALT,fg=$ACCENT"
set -g message-command-style "bg=$BG_ALT,fg=$ACCENT2"
set -g mode-style "bg=$ACCENT,fg=$BG"
set -g clock-mode-colour "$ACCENT"

set -g popup-style "bg=$BG"
set -g popup-border-style "fg=$ACCENT"
set -g popup-border-lines rounded
