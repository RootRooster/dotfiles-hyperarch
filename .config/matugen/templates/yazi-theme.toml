# Generated by matugen - do not edit manually
[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }
find_keyword  = { fg = "{{colors.tertiary.default.hex}}", bold = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bold = true }
marker_copied   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_copied   = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
unset_main  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
current = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.secondary.default.hex}}" }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[which]
border = { fg = "{{colors.primary.default.hex}}" }
cand   = { fg = "{{colors.primary.default.hex}}" }
rest   = { fg = "{{colors.outline.default.hex}}" }
desc   = { fg = "{{colors.tertiary.default.hex}}" }
separator_style = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}" }

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.tertiary.default.hex}}", bold = true }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
selected = { reversed = true }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.tertiary.default.hex}}", bold = true }

[help]
border  = { fg = "{{colors.primary.default.hex}}" }
chord   = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "{{colors.tertiary.default.hex}}" },
	{ mime = "**/{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.error.default.hex}}" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.secondary_fixed_dim.default.hex}}" },
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline.default.hex}}" },
	{ url = "*", is = "orphan", fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" },
	{ url = "*", is = "exec", fg = "{{colors.tertiary_fixed_dim.default.hex}}", bold = true },
	{ url = "*", is = "dummy", fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" },
	{ url = "*/", is = "dummy", fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
	{ url = "*", fg = "{{colors.on_surface.default.hex}}" },
]
