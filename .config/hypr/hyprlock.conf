# Matches the Cyber waybar / SDDM login theme.
# Previous ML4W version: hyprlock.conf.bak

$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles

# Cyber Neon palette
$bg      = rgba(11, 16, 23, 0.86)
$bg_alt  = rgb(0f1620)
$fg      = rgb(c8f7ff)
$sub     = rgb(8fb8c4)
$dim     = rgb(5f8794)
$accent  = rgb(00f0ff)
$accent2 = rgb(ff2bd6)
$warn    = rgb(ffb000)
$alert   = rgb(ff3355)
$font    = JetBrainsMono Nerd Font

general {
    ignore_empty_input = true
    hide_cursor = true
}

# Wallpaper, blurred and darkened
background {
    monitor =
    path = $ml4w_cache_folder/blurred_wallpaper.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.15
}

# Left panel + cyan edge
shape {
    monitor =
    size = 560, 100%
    color = $bg
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

shape {
    monitor =
    size = 2, 100%
    color = $accent
    rounding = 0
    position = 560, 0
    halign = left
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 240, 255, 0.6)
}

# Status tag
label {
    monitor =
    text = <b>󰌾  SESSION LOCKED</b>
    color = $accent2
    font_size = 13
    font_family = $font
    position = 70, 300
    halign = left
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = $fg
    font_size = 96
    font_family = $font
    position = 64, 200
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 240, 255, 0.25)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A · %d.%m.%Y')"
    color = $sub
    font_size = 17
    font_family = $font
    position = 70, 95
    halign = left
    valign = center
}

# User
label {
    monitor =
    text = <b>  $USER</b>
    color = $accent
    font_size = 14
    font_family = $font
    position = 70, -10
    halign = left
    valign = center
}

# Password
input-field {
    monitor =
    size = 420, 52
    outline_thickness = 2
    rounding = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = false
    dots_rounding = -2
    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    font_family = $font
    check_color = $accent2
    fail_color = $alert
    capslock_color = $warn
    numlock_color = -1
    bothlock_color = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##5f8794">password…</span>
    fail_text = <b>ACCESS DENIED</b> ($ATTEMPTS)
    hide_input = false
    position = 70, -80
    halign = left
    valign = center
}

# Status line: battery · Wi-Fi
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%   󰖩 $(nmcli -t -f active,ssid dev wifi 2>/dev/null | sed -n 's/^yes://p' | head -n1)"
    color = $dim
    font_size = 11
    font_family = $font
    position = 70, 60
    halign = left
    valign = bottom
}

# Host
label {
    monitor =
    text = cmd[update:0] echo "$(cat /etc/hostname)"
    color = $dim
    font_size = 11
    font_family = $font
    position = -40, 60
    halign = right
    valign = bottom
}
