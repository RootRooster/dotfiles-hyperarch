# Add your additional Hyprland configurations here

# Sound panel (pwvucontrol, opened from the waybar volume module)
windowrule {
    name = cyber-sound
    match:class = (com.saivert.pwvucontrol)
    float = true
    center = true
    size = 920 560
}

# Network manager (nmrs, opened from the waybar network module)
windowrule {
    name = cyber-network
    match:class = (org.nmrs.ui)
    float = true
    center = true
    size = 760 560
}

# Bluetooth (bluetui in a Cyber kitty, opened from the waybar bluetooth module)
windowrule {
    name = cyber-bluetooth
    match:class = (cyber-bluetooth)
    float = true
    center = true
    size = 1000 620
}

# Claude quick answers (rofi AI tab -> live answer window)
windowrule {
    name = cyber-ai
    match:class = (cyber-ai)
    float = true
    center = true
    size = 900 560
}

# -----------------------------------------------------
# Screenshots: Cyber menu (vim keys) — ~/.config/hypr/scripts/cyber-shot.sh
# Ctrl+Shift+4 uses the key's position (code:13), so it works regardless of layout.
# -----------------------------------------------------
unbind = SUPER, PRINT
bind = SUPER, PRINT, exec, ~/.config/hypr/scripts/cyber-shot.sh
bind = CTRL SHIFT, code:13, exec, ~/.config/hypr/scripts/cyber-shot.sh

# -----------------------------------------------------
# ML4W GUI apps removed — drop their key bindings
# -----------------------------------------------------
unbind = SUPER CTRL, S
unbind = , XF86Tools
unbind = CTRL ALT, T        # ML4W theme switcher (removed)

# Calculator (qalc in a Cyber terminal, Super+Ctrl+C)
windowrule {
    name = cyber-calc
    match:class = (cyber-calc)
    float = true
    center = true
    size = 760 460
}
